<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيلو - تفاصيل المنتج</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🇩🇿</span>
                <span class="logo-text">بيلو</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="index.html#products">المنتجات</a></li>
                <li><a href="contact.html">اتصل بنا</a></li>
            </ul>
            <div class="nav-actions">
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Product Detail -->
    <section class="product-detail">
        <div class="container">
            <div class="product-detail-grid" id="productDetail">
                <!-- Will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 بيلو - جميع الحقوق محفوظة</p>
            </div>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            const product = products.find(p => p.id === productId);

            if (!product) {
                document.getElementById('productDetail').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
                        <h2>المنتج غير موجود</h2>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">العودة للرئيسية</a>
                    </div>
                `;
                return;
            }

            document.title = `بيلو - ${product.name}`;

            document.getElementById('productDetail').innerHTML = `
                <div class="product-detail-image">
                    ${product.image}
                </div>
                <div class="product-detail-info">
                    <h1>${product.name}</h1>
                    <div class="price">${product.price.toLocaleString()} <span>د.ج</span></div>
                    <p class="description">${product.details}</p>
                    
                    <div class="size-selector">
                        <h4>المقاس:</h4>
                        <div class="size-options">
                            ${product.sizes.map((size, i) => `
                                <div class="size-option ${i === 1 ? 'active' : ''}" onclick="selectSize(this)">${size}</div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="quantity-selector">
                        <h4>الكمية:</h4>
                        <button onclick="changeDetailQty(-1)">-</button>
                        <span id="detailQty">1</span>
                        <button onclick="changeDetailQty(1)">+</button>
                    </div>

                    <button class="btn btn-primary detail-add-btn" onclick="addProductToCart(${product.id})">
                        <i class="fas fa-shopping-cart"></i> أضف إلى السلة
                    </button>
                </div>
            `;
        });

        let detailQty = 1;

        function changeDetailQty(change) {
            detailQty = Math.max(1, detailQty + change);
            document.getElementById('detailQty').textContent = detailQty;
        }

        function selectSize(el) {
            document.querySelectorAll('.size-option').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
        }

        function addProductToCart(productId) {
            for (let i = 0; i < detailQty; i++) {
                addToCart(productId);
            }
        }
    </script>
</body>
</html>
