<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيلو - سلة المشتريات</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🇩🇿</span>
                <span class="logo-text">بيلو</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="index.html#products">المنتجات</a></li>
                <li><a href="contact.html">اتصل بنا</a></li>
            </ul>
            <div class="nav-actions">
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <h1><i class="fas fa-shopping-cart"></i> سلة المشتريات</h1>
    </div>

    <!-- Cart Section -->
    <section class="cart-section">
        <div class="container" id="cartContainer">
            <!-- Cart content will be loaded dynamically -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 بيلو - جميع الحقوق محفوظة</p>
            </div>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script>
        function renderCart() {
            const container = document.getElementById('cartContainer');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <i class="fas fa-shopping-cart"></i>
                        <h3>سلة المشتريات فارغة</h3>
                        <p>لم تقم بإضافة أي منتجات بعد</p>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">تسوق الآن</a>
                    </div>
                `;
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal > 50000 ? 0 : 800;
            const total = subtotal + shipping;

            container.innerHTML = `
                <div class="cart-items">
                    ${cart.map(item => `
                        <div class="cart-item">
                            <div class="cart-item-image">${item.image}</div>
                            <div class="cart-item-info">
                                <h4>${item.name}</h4>
                                <p>${item.price.toLocaleString()} د.ج للقطعة</p>
                            </div>
                            <div class="cart-item-quantity">
                                <button onclick="updateQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                            <div class="cart-item-price">${(item.price * item.quantity).toLocaleString()} د.ج</div>
                            <button class="cart-item-remove" onclick="removeFromCart(${item.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `).join('')}
                </div>

                <div class="cart-summary">
                    <div class="cart-summary-row">
                        <span>المجموع الفرعي</span>
                        <span>${subtotal.toLocaleString()} د.ج</span>
                    </div>
                    <div class="cart-summary-row">
                        <span>التوصيل</span>
                        <span>${shipping === 0 ? 'مجاني' : shipping.toLocaleString() + ' د.ج'}</span>
                    </div>
                    ${shipping === 0 ? '<div class="cart-summary-row" style="color: var(--primary); font-size: 0.85rem;"><span>🎉 توصيل مجاني للطلبات فوق 50,000 د.ج</span></div>' : ''}
                    <div class="cart-summary-row total">
                        <span>المجموع الكلي</span>
                        <span>${total.toLocaleString()} د.ج</span>
                    </div>
                    <button class="btn btn-primary checkout-btn" onclick="checkout()">
                        <i class="fas fa-credit-card"></i> إتمام الطلب
                    </button>
                </div>
            `;
        }

        function checkout() {
            showToast('شكراً لك! سيتم التواصل معك لتأكيد الطلب');
            setTimeout(() => {
                cart = [];
                saveCart();
                renderCart();
            }, 2000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });
    </script>
</body>
</html>
